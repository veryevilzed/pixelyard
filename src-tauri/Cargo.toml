[package]
name = "pixelyard"
version = "0.1.2"
description = "Редактор изображений для подготовки ресурсов"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "pixelyard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
webp = { version = "0.3.1", default-features = false }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
